name: chart

on:
  push:
    tags:
      - chart-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPOSITORY: oci://ghcr.io/therealm-tech/charts

jobs:
  version:
    name: check the tag against the committed versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: derive the version from the tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$GITHUB_REF_NAME" != chart-* ]]; then
            echo "The chart is published from a chart-X.Y.Z tag; this run is on ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}." >&2
            echo "Start a manual run on a chart-* tag, or cut a release with scripts/release.sh." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#chart-}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not chart-X.Y.Z or chart-X.Y.Z-rcN." >&2
            exit 1
          fi

          stale=""
          committed="$(sed -n 's/^version:[[:space:]]*//p' charts/therealm-layout/Chart.yaml)"
          [ "$committed" = "$version" ] || stale+="  charts/therealm-layout/Chart.yaml: version ${committed}"$'\n'
          if [[ "$version" != *-* ]]; then
            while read -r v; do
              [ "$v" = "$version" ] || stale+="  example/clusters/mgmt-1/root.yaml: targetRevision ${v}"$'\n'
            done < <(sed -nE 's/^[[:space:]]+targetRevision:[[:space:]]+([0-9][^[:space:]]*)$/\1/p' example/clusters/mgmt-1/root.yaml)
            while read -r v; do
              [ "$v" = "$version" ] || stale+="  README.md: --version ${v}"$'\n'
            done < <(sed -nE 's#.*oci://ghcr.io/therealm-tech/charts/therealm-layout --version ([^[:space:]]+).*#\1#p' README.md)
          fi
          if [ -n "$stale" ]; then
            echo "The tag says ${version}, but these committed references do not:" >&2
            printf '%s' "$stale" >&2
            echo "Cut releases with scripts/release.sh so the two stay in step." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish the chart to GHCR
    needs:
      - version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install Helm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: helm
          cache: false
      - name: package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package charts/therealm-layout --version "$VERSION" --destination "$RUNNER_TEMP"
      - name: log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # actions/attest pushes the attestation with Docker's credentials, not Helm's.
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
      - name: push the chart
        id: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # The default shell runs without pipefail: tee would hide a failed push.
        shell: bash
        run: |
          helm push "$RUNNER_TEMP/therealm-layout-${VERSION}.tgz" "$REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "helm push printed no manifest digest to attest." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: attest the chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/therealm-tech/charts/therealm-layout
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ needs.version.outputs.version }}
          push-to-registry: true
