name: renovate

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Log what Renovate would do, without touching a branch or a pull request
        type: boolean
        default: false
      logLevel:
        description: Renovate log level
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    steps:
      - name: run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          renovate-version: 44.262.1
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
