app:
  url: ghcr.io/argoproj/argo-helm
  chart: argo-cd
  revision: 10.11.6
  project: default
  namespace: argocd
  syncOptions:
    - CreateNamespace=true
    # The Application and ApplicationSet CRDs are past the 262144-byte
    # annotation limit of a client-side apply.
    - ServerSideApply=true
  managedNamespaceMetadata:
    labels:
      pod-security.kubernetes.io/enforce: baseline
