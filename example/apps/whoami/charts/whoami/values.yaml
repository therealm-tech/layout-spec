# -- The whoami HTTP server.
# @default -- see the keys below
whoami:
  # -- Number of pods.
  replicaCount: 1
  # -- Number of old ReplicaSets kept for rollback.
  revisionHistoryLimit: 0
  # -- Container image of the server.
  # @default -- see the keys below
  image:
    # -- Image repository.
    repository: docker.io/traefik/whoami
    # -- (string) Image tag. Defaults to `.Chart.AppVersion`.
    tag: ~
  # -- Port the container listens on.
  port: 8080
  # -- (list) Extra environment variables for the container.
  extraEnv: []
  # -- (list) Extra volumes for the pod.
  extraVolumes: []
  # -- (list) Extra volume mounts for the container.
  extraVolumeMounts: []
  # -- Pod-level security context, at the restricted Pod Security Standard.
  podSecurityContext:
    # -- Refuse to start a container whose image runs as UID 0.
    runAsNonRoot: true
    # -- UID of the container process.
    runAsUser: 65532
    # -- GID of the container process.
    runAsGroup: 65532
    # -- GID owning mounted volumes.
    fsGroup: 65532
    # -- Seccomp profile filtering the system calls of every container.
    seccompProfile:
      # -- `RuntimeDefault` applies the container runtime's default profile.
      type: RuntimeDefault
  # -- Container-level security context, at the restricted Pod Security Standard.
  securityContext:
    # -- Forbid a process from gaining more privileges than its parent.
    allowPrivilegeEscalation: false
    # -- Mount the root filesystem read-only.
    readOnlyRootFilesystem: true
    # -- Linux capabilities of the container.
    capabilities:
      # -- Capabilities dropped from the container; `ALL` leaves it none.
      drop:
        - ALL
  # -- Container resources. No CPU limit: a limit throttles a compressible resource.
  resources:
    # -- Resources reserved for the container when it is scheduled.
    requests:
      # -- CPU request.
      cpu: 10m
      # -- Memory request.
      memory: 16Mi
      # -- Ephemeral storage request.
      ephemeral-storage: 16Mi
    # -- Caps past which the container is killed or evicted.
    limits:
      # -- Memory limit.
      memory: 32Mi
      # -- Ephemeral storage limit.
      ephemeral-storage: 32Mi
