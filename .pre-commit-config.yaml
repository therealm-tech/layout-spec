default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: (^|/)charts/[^/]+/(templates|files)/
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        # Warning-level rules (document-start among them) are printed and then
        # ignored without this — the hook passes anyway.
        args:
          - --strict
        # Helm templates and the chart's ApplicationSet template files are Go
        # templating, not YAML, until they are rendered.
        exclude: (^|/)charts/[^/]+/(templates|files)/

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-taskfile

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6699bba29a0ff83f9863dea5e15ad2fb1309a432  # frozen: 44.262.1
    hooks:
      - id: renovate-config-validator
        args:
          - --strict
          - --no-global

  - repo: https://github.com/google/go-jsonnet
    rev: 567b61ac4a6c23546a62d79324bb4aaed6bdc941  # frozen: v0.22.0
    hooks:
      - id: jsonnet-format
      - id: jsonnet-lint

  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg
      - id: mise-fmt
        name: mise fmt
        entry: mise fmt
        language: system
        files: ^mise\.toml$
        pass_filenames: false
      - id: helm-lint
        name: helm lint (therealm-layout)
        entry: helm lint --strict charts/therealm-layout -f charts/therealm-layout/values-lint.yaml
        language: system
        pass_filenames: false
        files: ^charts/therealm-layout/
      - id: helm-lint-whoami
        name: helm lint (example whoami)
        entry: helm lint --strict example/apps/whoami/charts/whoami
        language: system
        pass_filenames: false
        files: ^example/apps/whoami/charts/whoami/
      - id: helm-docs
        name: helm-docs
        entry: helm-docs --chart-search-root charts
        language: system
        pass_filenames: false
        files: ^charts/
      - id: trivy-chart
        name: trivy config (therealm-layout)
        entry: trivy config --exit-code 1 --helm-values charts/therealm-layout/values-lint.yaml charts/therealm-layout
        language: system
        pass_filenames: false
        files: ^charts/therealm-layout/
