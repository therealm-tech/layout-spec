{{- /*
A key a level sets to null stays in `.app`, holding null: it is unset, so
the patch tests a key by its value, never with `hasKey`.
*/}}
{{- /*
A parameter YAML reads as a number reaches the patch as a float64, which `quote`
alone prints in exponent form from seven digits on (20241010 → "2.024101e+07").
*/}}
{{- define "string" }}{{ if kindIs "float64" . }}{{ toJson . | quote }}{{ else }}{{ quote . }}{{ end }}{{ end }}
spec:
  {{- with dig "app" "namespace" "" . }}
  destination:
    namespace: {{ template "string" . }}
  {{- end }}
  sources:
    - repoURL: {{ if dig "app" "url" "" . }}{{ template "string" .app.url }}{{ else }}{{ quote $catalogURL }}{{ end }}
      targetRevision: {{ if dig "app" "url" "" . }}{{ template "string" .app.revision }}{{ else }}{{ quote $catalogRevision }}{{ end }}
      {{- if dig "app" "chart" "" . }}
      chart: {{ template "string" .app.chart }}
      {{- else if dig "app" "url" "" . }}
      path: {{ template "string" .app.path }}
      {{- else }}
      path: {{ print $catalogPath .app.path | quote }}
      {{- /*
      Any `directory` makes Argo CD skip its source type detection and render
      the source as plain YAML or Jsonnet, which breaks a Kustomize source: the
      library path is set only where the path itself says Jsonnet.
      */}}
      {{- if regexMatch "^apps/[^/]+/jsonnet$" .app.path }}
      directory:
        jsonnet:
          libs:
            - {{ print $catalogPath "lib" | quote }}
      {{- end }}
      {{- end }}
      {{- /* A chart is either referenced by `chart`, or lives under apps/<app>/charts/. */}}
      {{- if or (dig "app" "chart" "" .) (regexMatch "^apps/[^/]+/charts/" (dig "app" "path" "" .)) }}
      helm:
        {{- /* A template's output cannot be piped: a valid release name holds no quote nor backslash. */}}
        releaseName: "{{ template "releaseName" . }}"
        ignoreMissingValueFiles: {{ $helmIgnoreMissingValueFiles }}
        valueFiles:
          - {{ printf "$catalog/%sapps/%s/values.yaml" $catalogPath .values.app | quote }}
          - {{ printf "$platform/%senvs/%s/%s/values.yaml" $platformPath .values.env .values.app | quote }}
          - {{ printf "$platform/%sclusters/%s/apps/%s/values.yaml" $platformPath .values.cluster .values.app | quote }}
          - {{ printf "$platform/%s/values.yaml" .instanceFile.path.path | quote }}
    - repoURL: {{ quote $catalogURL }}
      targetRevision: {{ quote $catalogRevision }}
      ref: catalog
    - repoURL: {{ quote $platformURL }}
      targetRevision: {{ quote $platformRevision }}
      ref: platform
      {{- end }}
    - repoURL: {{ quote $platformURL }}
      targetRevision: {{ quote $platformRevision }}
      path: {{ quote .instanceFile.path.path }}
      directory:
        recurse: {{ $manifestsRecurse }}
        include: {{ $manifestsInclude | quote }}
  {{- $syncOptions := concat (dig "app" "syncOptions" (list) . | default (list)) $extraSyncOptions }}
  {{- $namespaceMetadata := dig "app" "managedNamespaceMetadata" (dict) . }}
  {{- if or $syncOptions $namespaceMetadata }}
  syncPolicy:
    {{- with $syncOptions }}
    syncOptions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $namespaceMetadata }}
    managedNamespaceMetadata:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with dig "app" "ignoreDifferences" (list) . }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
